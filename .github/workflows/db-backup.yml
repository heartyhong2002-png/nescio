name: DB Backup

# 매일 public 스키마(profiles, watchlist_items — 실제 서비스 데이터)를 SQL로 덤프해서
# db-backups 브랜치에 커밋해두는 무료 백업. auth 스키마(계정 자체)는 Supabase가 내부적으로
# 관리하는 영역이라 pg_dump로 통째로 복원하려 하면 오히려 깨질 수 있어서 일부러 뺐다 —
# 목적은 "유저가 실수로 지워져도 그 유저가 담아뒀던 관심종목/성향 데이터를 참고해서 복구"이지,
# auth.users 자체를 SQL로 되살리는 게 아니다.
#
# 필요한 사전 준비:
# 1. GitHub 저장소 Settings → Secrets and variables → Actions에 SUPABASE_DB_URL 등록
#    (Supabase 대시보드 → Settings → Database → Connection string → "Session pooler" 모드,
#    5432 포트짜리 URI. 반드시 Session pooler여야 함 — GitHub Actions는 IPv4만 되는데
#    Direct connection은 무료 플랜에서 IPv6만 지원하고, Transaction pooler(6543)는 pg_dump가
#    쓰는 prepared statement를 지원 안 해서 실패한다.)
# 2. db-backups 브랜치가 미리 존재해야 함(최초 1회 orphan 브랜치로 만들어둠).
#
# 시간 기준: 모든 날짜·파일명은 UTC 기준이다. (예: backups/2026-09-29.sql)
#   cron "0 18 * * *" = UTC 18:00 = KST 03:00(다음날) — 트래픽 적은 새벽.
#
# 보존 한계:
# - backups/ 폴더에서 30일 초과 SQL 파일은 워크트리에서 삭제·커밋되지만,
#   Git 이력(pack/reflog)에는 삭제 전 파일 내용이 남는다. 완전 제거가 필요하면
#   git filter-repo 또는 BFG를 별도로 실행해야 하며, 이 워크플로우에서는 처리하지 않는다.
# - pg_dump로 내보내는 public 스키마에는 사용자 관심종목·프로필 데이터가 포함된다.
#   db-backups 브랜치의 접근 권한을 제한하거나, 별도 private repo에 push하는 것을 권장한다.

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout db-backups branch
        uses: actions/checkout@v4
        with:
          ref: db-backups
          fetch-depth: 0

      # ubuntu-latest 기본 저장소의 postgresql-client는 16.x인데, Supabase는 이미 Postgres 17을
      # 쓰고 있다. pg_dump는 자기보다 최신인 서버는 버전 불일치로 덤프를 거부하므로(server version:
      # 17.6 vs pg_dump 16.15 -> "aborting because of server version mismatch"), PostgreSQL 공식
      # APT 저장소(apt.postgresql.org)를 추가해서 17번대 클라이언트를 설치한다.
      - name: Install postgresql-client 17
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump public schema
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" \
            --schema=public --no-owner --no-acl \
            -f "backups/$(date -u +%F).sql"

      - name: Prune backups older than 30 days
        run: |
          set -euo pipefail
          find backups -name "*.sql" -mtime +30 -delete

      - name: Commit and push backup
        run: |
          set -euo pipefail
          git config user.name "db-backup-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: $(date -u +%F) public schema (UTC)"
          git push origin db-backups